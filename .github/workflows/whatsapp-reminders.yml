name: WhatsApp Reminder Scheduler

on:
  schedule:
    # Daily reminder — 5:00 PM IST = 11:30 AM UTC
    - cron: "30 11 * * *"

    # September 6 — Webinar day
    # 8:00 AM IST = 2:30 AM UTC
    - cron: "30 2 6 9 *"

    # 10:00 AM IST = 4:30 AM UTC
    - cron: "30 4 6 9 *"

    # 10:30 AM IST = 5:00 AM UTC
    - cron: "0 5 6 9 *"

    # 11:00 AM IST = 5:30 AM UTC
    - cron: "30 5 6 9 *"

    # 1:00 PM IST = 7:30 AM UTC
    - cron: "30 7 6 9 *"

  workflow_dispatch:

jobs:
  send-whatsapp-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Call WhatsApp Reminder API
        run: |
          curl --fail-with-body \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.puneetkaursaluja.com/api/cron/whatsapp-reminders"
